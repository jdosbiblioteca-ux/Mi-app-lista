name: Build APK con Buildozer

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Instalar Android Command Line Tools manualmente
      run: |
        ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        
        # Descargar herramientas de línea de comandos oficiales de Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        
        # Reorganizar la estructura para que Buildozer reconozca el sdkmanager
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        rm cmdline-tools.zip
        
        # Aceptar licencias automáticamente
        mkdir -p "$ANDROID_SDK_ROOT/licenses"
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Construir APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir artefacto (APK)
      uses: actions/upload-artifact@v4
      with:
        name: apk-app
        path: bin/*.apk
