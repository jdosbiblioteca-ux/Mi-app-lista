name: Build APK con Buildozer

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Post Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Pre-aceptar licencias de Android SDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bac163af42a8b58fada7f18d7d8058584e06" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n24333f8a43b68242cef95709aec1f326cfa0227f" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Construir APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir artefacto (APK)
      uses: actions/upload-artifact@v4
      with:
        name: apk-app
        path: bin/*.apk
